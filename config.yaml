# Defaults for pipeline runs — CLI args override these at runtime.
# Safe to commit: secrets (Notion token, future API keys) live in the
# gitignored .env, never here.

collect:
  location: ""     # OSM area name, e.g. "Berlin" — usually given per run via --location
  country: Serbia  # stamped on every lead the same way as location; the qualification
                   # filter's location gate checks this, not the free-text city
  categories: []   # e.g. [restaurant, hairdresser] or raw OSM tags like "craft=roofer"
  manual_csv: leads_manual.csv   # hand-gathered leads; see leads_manual.csv.example

overpass:
  endpoint: https://overpass-api.de/api/interpreter
  timeout_s: 60

# gosom/google-maps-scraper — supplement only (ToS gray area, see docs/RESOURCES.md).
# Install a release binary from github.com/gosom/google-maps-scraper/releases.
maps:
  binary: tools/google-maps-scraper   # v1.16.2 darwin-amd64 release, runs via Rosetta
  depth: 1           # scroll depth per query. v1.16.2 fails ("target closed", 0 rows) at 2+ — verified 2026-10-08
  language: ""       # e.g. "sr" — empty uses the scraper's default
  extract_emails: true
  timeout_s: 900

# Phase 2 — contact scraping + Lighthouse audit.
# Install the audit engine once: npm install -g lighthouse (see docs/RESOURCES.md).
enrich:
  delay_s: 2           # pause between leads' sites — shared courtesy, keep >= 1
  http_timeout_s: 20
  lighthouse:
    binary: lighthouse
    timeout_s: 120     # per-site cap; slow sites fail into Lead.errors, not hang the batch

# Phase 4 — Notion sync. The integration token and database id are secrets
# and live in the gitignored .env as NOTION_TOKEN / NOTION_DATABASE_ID (see
# README setup), never here.
notion:
  database_id: ""      # set via NOTION_DATABASE_ID in .env
  api_version: "2022-06-28"
  delay_s: 0.35        # pause between page creates — Notion allows ~3 req/s
  timeout_s: 30
  cache_path: data/seen_domains.json   # local dedupe cache, refreshed via --refresh-cache

# Phase 3 — scoring weights. The reasoning behind every number is in
# docs/SCORING.md; tune here after the first real outreach batch (docs/SCORING.md §7),
# and bump version whenever weights or formula shape change so old and new
# total_scores are never silently compared as if they meant the same thing.
# v3: dropped icp_fit/intent entirely — industry and location moved out of
# scoring into the qualification: filters below, added reachability_score,
# and total_score is now opportunity_score * a reachability-derived
# multiplier instead of a three-way weighted sum (docs/SCORING.md changelog).
scoring:
  version: 3

  # reachability_score: can we contact this lead right now, today. Sums to
  # 100 with every channel present; used both as its own Notion field and to
  # derive the total_score multiplier below.
  reachability:
    has_email: 50
    has_phone: 40
    has_social: 10

  # opportunity_score (was website_audit_score — same underlying values,
  # renamed so it isn't mistaken for a quality score): how much upside in
  # pitching a redesign/new build. Computed case is 100 - weighted
  # Lighthouse quality + flat bonuses, capped at audited_score_cap. An
  # "unclear" lead (domain present, no usable Lighthouse data) gets no
  # opportunity_score at all — see scorer.py — rather than a fixed
  # discounted value like it used to.
  opportunity:
    no_website_score: 90           # no domain at all — strongest new-build signal,
                                    # a fixed policy value, not a placeholder
    audited_score_cap: 85          # must stay below no_website_score — a bad
                                   # audited site is still an easier sell than a
                                   # blank slate, so it must never outrank
                                   # "no website at all" (docs/SCORING.md §4.2)
    no_https_bonus: 10             # flat add-ons: easy one-sentence pitch hooks
    not_mobile_friendly_bonus: 10  # that Lighthouse doesn't penalize cleanly
    lighthouse_weights:            # must sum to 1.0
      performance: 0.40      # most visible; "this site feels broken"
      best_practices: 0.25   # structural/security issues perf misses
      accessibility: 0.20    # real gap, rarely why a cold lead replies
      seo: 0.15              # most sites already score 75-100 — least signal

# Phase 3 — qualification filters, run before scoring, not part of the
# score itself (docs/SCORING.md §2). A lead only gets scored/marked Qualified if
# it is in a target country. Industry is deliberately neither filtered nor
# weighted: it's too early to know which vertical converts best — revisit once
# there's real close-rate data across verticals.
qualification:
  target_countries: [Serbia]

