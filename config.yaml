# Defaults for pipeline runs — CLI args override these at runtime.
# Safe to commit: secrets (Notion token, future API keys) live in the
# gitignored .env, never here.

collect:
  location: ""     # OSM area name, e.g. "Berlin" — usually given per run via --location
  categories: []   # e.g. [restaurant, hairdresser] or raw OSM tags like "craft=roofer"
  manual_csv: leads_manual.csv   # hand-gathered leads; see leads_manual.csv.example

overpass:
  endpoint: https://overpass-api.de/api/interpreter
  timeout_s: 60

# gosom/google-maps-scraper — supplement only (ToS gray area, see RESOURCES.md).
# Install a release binary from github.com/gosom/google-maps-scraper/releases.
maps:
  binary: tools/google-maps-scraper   # v1.16.2 darwin-amd64 release, runs via Rosetta
  depth: 3           # scroll depth per query; higher = more results, slower
  language: ""       # e.g. "sr" — empty uses the scraper's default
  extract_emails: true
  timeout_s: 900

# Phase 2 — contact scraping + Lighthouse audit.
# Install the audit engine once: npm install -g lighthouse (see RESOURCES.md).
enrich:
  delay_s: 2           # pause between leads' sites — shared courtesy, keep >= 1
  http_timeout_s: 20
  lighthouse:
    binary: lighthouse
    timeout_s: 120     # per-site cap; slow sites fail into Lead.errors, not hang the batch

# Phase 4 — Notion sync. The integration token is a secret and lives in the
# gitignored .env as NOTION_TOKEN (see README setup), never here.
notion:
  database_id: ebbfdaa7-5970-4917-a4b1-44ef846ac1c8   # "ONIX Leads Pipeline"
  api_version: "2022-06-28"
  delay_s: 0.35        # pause between page creates — Notion allows ~3 req/s
  timeout_s: 30
  cache_path: data/seen_domains.json   # local dedupe cache, refreshed via --refresh-cache

# Phase 3 — scoring weights. The reasoning behind every number is in
# SCORING.md; tune here after the first real outreach batch (SCORING.md §7),
# and bump version whenever weights or formula shape change so old and new
# total_scores are never silently compared as if they meant the same thing.
scoring:
  version: 1

  # icp_fit_score: reachability + legitimacy of the business itself —
  # deliberately ignores the website (that's website_audit). Sums to 100
  # with everything triggered; clamped at 100 either way.
  icp_fit:
    has_email: 30
    has_phone: 25
    has_social: 15
    established_bonus: 15      # awarded when emails+phones+socials >= threshold
    established_threshold: 2   # more contact surface ~ multi-person practice
    industry_match: 15         # full credit while runs are single-industry

  # website_audit_score: opportunity, not quality — higher = more to sell
  # into. Computed case is 100 - weighted Lighthouse quality + flat bonuses,
  # clamped to [0, 100].
  website_audit:
    no_website_score: 90           # no domain at all — strongest new-build signal
    unreachable_domain_score: 65   # domain exists, audit failed — discounted: the
                                   # practice may be gone or the domain abandoned
    no_https_bonus: 10             # flat add-ons: easy one-sentence pitch hooks
    not_mobile_friendly_bonus: 10  # that Lighthouse doesn't penalize cleanly
    lighthouse_weights:            # must sum to 1.0
      performance: 0.40      # most visible; "this site feels broken"
      best_practices: 0.25   # structural/security issues perf misses
      accessibility: 0.20    # real gap, rarely why a cold lead replies
      seo: 0.15              # most sites already score 75-100 — least signal

  # total_score = weighted sum of the three sub-scores; must sum to 1.0.
  # intent is smallest since it's 0.0 for every lead until the manual
  # research pass (SCORING.md §5) fills it in on the top candidates.
  total:
    icp_fit: 0.35
    website_audit: 0.50
    intent: 0.15
